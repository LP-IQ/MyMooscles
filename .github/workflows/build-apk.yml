name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar a pasta android (flutter create)
        run: |
          flutter --version
          flutter create . --platforms=android --project-name mymooscles --org io.github.lpiq
          sed -i 's/android:label="mymooscles"/android:label="MyMooscles"/' android/app/src/main/AndroidManifest.xml

      - name: Ajustar Android (assinatura fixa, desugaring, permissões de notificação)
        run: |
          python3 tool/patch_android.py
          cat android/app/build.gradle*
          grep -n "permission\|receiver" android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Ícone do app (se falhar, segue com o ícone padrão)
        continue-on-error: true
        run: |
          cp pubspec.yaml /tmp/pubspec.bak
          if flutter pub add --dev flutter_launcher_icons && dart run flutter_launcher_icons -f flutter_launcher_icons.yaml; then
            echo "ícone gerado"
          else
            cp /tmp/pubspec.bak pubspec.yaml
            flutter pub get
            exit 1
          fi

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib || true

      - name: Compilar APK
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Conferir assinatura (falha se a chave não for a fixa)
        run: |
          ESPERADO=$(keytool -list -v -keystore android-signing/debug.keystore -storepass android | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //; s/://g' | tr 'A-F' 'a-f')
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OBTIDO=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*digest: //')
          echo "esperado: $ESPERADO"
          echo "obtido:   $OBTIDO"
          test "$ESPERADO" = "$OBTIDO"
          cp build/app/outputs/flutter-apk/app-release.apk MyMooscles.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyMooscles-apk
          path: MyMooscles.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MyMooscles (build ${{ github.run_number }})
          body: |
            APK gerado automaticamente a partir de ${{ github.sha }}.
            No celular: baixe MyMooscles.apk abaixo e instale (permita "instalar apps desconhecidos" para o navegador).
          files: MyMooscles.apk
          make_latest: true
